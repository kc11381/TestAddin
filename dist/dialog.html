<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>DLP Warning</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><style>* { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 24px;
      margin: 0;
      background: #fff;
      color: #323130;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: #a4262c;
    }
    .warning-badge {
      width: 24px;
      height: 24px;
      background: #a4262c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 14px;
      flex-shrink: 0;
    }
    .reason-box {
      background: #fdf3f4;
      border-left: 4px solid #a4262c;
      padding: 10px 14px;
      border-radius: 0 4px 4px 0;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .confidence {
      font-size: 12px;
      color: #605e5c;
      margin-bottom: 20px;
    }
    .buttons {
      display: flex;
      gap: 8px;
    }
    button {
      padding: 8px 18px;
      font-size: 13px;
      border-radius: 2px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { opacity: 0.85; }
    button:focus-visible {
      outline: 2px solid #0078d4;
      outline-offset: 2px;
    }
    #btn-encrypt { background: #0078d4; color: #fff; }
    #btn-send { background: #e1dfdd; color: #323130; }
    #btn-cancel { background: transparent; color: #0078d4; border: 1px solid #0078d4; }</style></head><body><div class="header"><div class="warning-badge">!</div><h2>Sensitive Content Detected</h2></div><div id="reason" class="reason-box">Sensitive content detected.</div><div id="confidence" class="confidence"></div><div class="buttons"><button id="btn-encrypt">Send Encrypted</button> <button id="btn-send">Send Anyway</button> <button id="btn-cancel">Cancel</button></div><script defer="defer" src="/dist/dialog.js"></script></body></html>
